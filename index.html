<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carnet Auto</title>
  <meta name="description" content="Suivi d'entretien de voiture : kilométrage, plan d'entretien, journal et rappels mensuels.">
  <meta name="theme-color" content="#1f6feb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28">
      <div>
        <div class="brand-title">Carnet Auto</div>
        <div class="brand-sub" id="car-name">—</div>
      </div>
    </div>
    <div class="row">
      <div class="km-pill" id="km-pill" title="Kilométrage estimé aujourd'hui">— km</div>
      <button class="icon-btn" data-tab="settings" aria-label="Réglages" title="Réglages">⚙️</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="dashboard" class="active"><span>🏠</span>Accueil</button>
    <button data-tab="plan"><span>🔧</span>Entretien</button>
    <button data-tab="logs"><span>📒</span>Journal</button>
    <button data-tab="readings"><span>📈</span>Km</button>
    <button data-tab="fuel"><span>⛽</span>Pleins</button>
    <button data-tab="docs"><span>🧾</span>Factures</button>
  </nav>

  <dialog id="modal">
    <form method="dialog" id="modal-form" class="modal-body"></form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="core.js"></script>
  <script src="tech-presets.js"></script>
  <script src="app.js"></script>
</body>
</html>
