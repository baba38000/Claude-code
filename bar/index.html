<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carnet de Bar</title>
  <meta name="description" content="Gestion de bar : caisse, carte et prix (règle des ×3), stock, achats, charges et résultat du mois, tâches.">
  <meta name="theme-color" content="#b4531a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28">
      <div>
        <div class="brand-title">Carnet de Bar</div>
        <div class="brand-sub" id="bar-name">—</div>
      </div>
    </div>
    <div class="row">
      <div class="km-pill" id="ca-pill" title="Chiffre d'affaires TTC du jour" data-tab="pos">— €</div>
      <button class="icon-btn" data-tab="settings" aria-label="Réglages" title="Réglages">⚙️</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="dashboard" class="active"><span>🏠</span>Accueil</button>
    <button data-tab="pos"><span>🧾</span>Caisse</button>
    <button data-tab="menu"><span>🍸</span>Carte</button>
    <button data-tab="stock"><span>📦</span>Stock</button>
    <button data-tab="compta"><span>💰</span>Compta</button>
    <button data-tab="tasks"><span>✅</span>À faire</button>
  </nav>

  <dialog id="modal">
    <form method="dialog" id="modal-form" class="modal-body"></form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="core.js"></script>
  <script src="starter.js"></script>
  <script src="stock-photos.js"></script>
  <script src="app.js"></script>
</body>
</html>
